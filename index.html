        const workerCode = `// Worker super-gemini — LIVE 100% từ vietlott.vn
const P = { mega645: "645", power655: "655", lotto535: "535", max3d: "max-3d", max3dpro: "max-3dpro" };
const G = { mega645: { dn: 6, max: 45 }, power655: { dn: 6, max: 55, bonus: 1 }, lotto535: { dn: 5, max: 35, bonus: 1 }, max3d: { d3: 1 }, max3dpro: { d3: 1 } };
const H = { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36", Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", "Accept-Language": "vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7", Referer: "https://vietlott.vn/" };
const CORS = { "Access-Control-Allow-Origin": "*", "Content-Type": "application/json; charset=utf-8" };
const out = (o, s = 200) => new Response(JSON.stringify(o), { status: s, headers: CORS });

function valid(d, g) {
  const a = d.nums;
  if (g.d3) return a.length >= 6 && a.length % 3 === 0 && a.every((x) => x >= 0 && x <= 9);
  return a.length === g.dn + (g.bonus || 0) && a.every((x) => x >= 1 && x <= g.max) && (g.rep || new Set(a.slice(0, g.dn)).size === g.dn);
}

async function grab(k) {
  const g = G[k];
  const r = await fetch("https://vietlott.vn/vi/trung-thuong/ket-qua-trung-thuong/" + P[k], { headers: H, cf: { cacheTtl: 30, cacheEverything: true } });
  const html = await r.text();
  if (!r.ok) throw new Error("vietlott.vn HTTP " + r.status + (/Just a moment|Chờ một chút/i.test(html) ? " (Cloudflare xác minh người dùng)" : ""));
  const i = html.indexOf("day_so_ket_qua");
  if (i < 0) throw new Error("Không thấy khối kết quả trong trang");
  let nums = [...html.substring(i, i + 3500).matchAll(/bong_tron[^"]*">\\s*(\\d+)\\s*</g)].map((m) => +m[1]);
  nums = g.d3 ? nums.slice(0, 12) : nums.slice(0, g.dn + (g.bonus || 0));
  if (k === "max3dpro" && nums.length === 12) nums = [...nums.slice(6), ...nums.slice(0, 6)];
  const m = html.replace(/<[^>]+>/g, " ").match(/#\\s*(\\d{3,7})\\D{0,25}?(\\d{2})\\/(\\d{2})\\/(\\d{4})/);
  if (!m) throw new Error("Không đọc được mã kỳ / ngày quay");
  const jp = html.match(/so_tien">\\s*<h3>([\\d.]+)<\/h3>/);
  const d = { id: m[1], date: \`\${m[4]}-\${m[3]}-\${m[2]}\`, nums, jp: jp ? +jp[1].replace(/\\./g, "") : null };
  if (!valid(d, g)) throw new Error("Dãy số đọc được không hợp lệ: " + nums.join(","));
  return d;
}

const better = (e, d) => !e || e.nums.length < d.nums.length || (e.nums.length === d.nums.length && e.jp == null && d.jp != null);
const seen = {};

async function saveDraw(env, k, d) {
  const git = gh(env), f = \`data/\${k}.json\`, old = await git.get(f);
  const prev = old ? JSON.parse(old.text).draws || [] : [];
  if (!better(prev.find((x) => x.id === d.id), d)) return;
  const map = new Map(prev.map((x) => [x.id, x])); map.set(d.id, d);
  const draws = [...map.values()].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id)).slice(0, 600);
  await git.put(f, JSON.stringify({ game: k, draws }), old?.sha);
}

const b64 = (s) => btoa(unescape(encodeURIComponent(s)));
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/\\n/g, ""))));

function gh(env) {
  const o = env.GITHUB_OWNER || "nguyenchemical", r = env.GITHUB_REPO || "VL-SUPER-GEMINI-AI", br = env.GITHUB_BRANCH || "main";
  const h = { Authorization: \`Bearer \${env.GITHUB_TOKEN}\`, "User-Agent": "vl-super-gemini-worker", Accept: "application/vnd.github+json" };
  const url = (p) => \`https://api.github.com/repos/\${o}/\${r}/contents/\${p}\`;
  return {
    async get(p) {
      const x = await fetch(\`\${url(p)}?ref=\${br}\`, { headers: h });
      if (x.status === 404) return null;
      if (!x.ok) throw new Error(\`GitHub GET \${p}: \${x.status}\`);
      const j = await x.json();
      return { sha: j.sha, text: unb64(j.content) };
    },
    async put(p, text, sha) {
      const x = await fetch(url(p), { method: "PUT", headers: h, body: JSON.stringify({ message: \`data: \${p}\`, content: b64(text), branch: br, ...(sha ? { sha } : {}) }) });
      if (!x.ok) throw new Error(\`GitHub PUT \${p}: \${x.status} \${(await x.text()).slice(0, 120)}\`);
    },
  };
}

async function run(env) {
  if (!env.GITHUB_TOKEN) throw new Error("Thiếu GITHUB_TOKEN");
  const git = gh(env), status = { updated: new Date().toISOString(), source: "vietlott.vn (Worker)", games: {} };
  let changed = false;
  for (const k of Object.keys(P)) {
    try {
      const d = await grab(k), f = \`data/\${k}.json\`, old = await git.get(f);
      const map = new Map((old ? JSON.parse(old.text).draws || [] : []).map((x) => [x.id, x]));
      if (better(map.get(d.id), d)) map.set(d.id, d);
      const draws = [...map.values()].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id)).slice(0, 600);
      const text = JSON.stringify({ game: k, draws });
      if (!old || old.text !== text) { await git.put(f, text, old?.sha); changed = true; }
      status.games[k] = { ok: true, count: draws.length, latestId: draws[0].id, latestDate: draws[0].date };
    } catch (e) { status.games[k] = { ok: false, error: String(e.message || e) }; }
  }
  const st = await git.get("data/status.json");
  if (changed || !st || Date.now() - new Date(JSON.parse(st.text).updated).getTime() > 3 * 36e5) await git.put("data/status.json", JSON.stringify(status), st?.sha);
  return status;
}

async function diag(env) {
  const r = { token: !!env.GITHUB_TOKEN, github: {}, games: {} };
  if (env.GITHUB_TOKEN) {
    const git = gh(env);
    try { r.github.read = !!(await git.get("index.html")); } catch (e) { r.github.read = String(e.message); }
  }
  for (const k of Object.keys(P)) {
    try { const d = await grab(k); r.games[k] = { ok: true, id: d.id, date: d.date, nums: d.nums.length }; }
    catch (e) { r.games[k] = { ok: false, error: String(e.message || e) }; }
  }
  return r;
}

export default {
  async scheduled(_e, env, ctx) { ctx.waitUntil(run(env)); },
  async fetch(req, env, ctx) {
    const u = new URL(req.url), a = u.searchParams.get("action");
    if (req.method === "OPTIONS") return new Response(null, { headers: { ...CORS, "Access-Control-Allow-Methods": "GET" } });
    try {
      if (a === "latest") { const k = u.searchParams.get("game"); if (!P[k]) return out({ ok: false, error: "game không hỗ trợ" }, 400); const d = await grab(k); if (env.GITHUB_TOKEN && seen[k] !== d.id) { seen[k] = d.id; ctx.waitUntil(saveDraw(env, k, d).catch(() => { delete seen[k]; })); } return out({ ok: true, game: k, draw: d }); }
      if (a === "run-now") return out(await run(env));
      if (a === "diagnose") return out(await diag(env));
      return out({ ok: true, hint: "?action=latest&game=mega645 | run-now | diagnose", games: Object.keys(P) });
    } catch (e) { return out({ ok: false, error: String(e.message || e) }, 502); }
  },
};`;

                    document.getElementById('draw-date').innerText = data.draw.date;

            else if (game === 'power655') {
                const main = numbers.slice(0, 6); const spec = numbers[6];
                html += main.map(n => \`<span class="number-ball ball-power">\${n < 10 ? '0'+n : n}</span>\`).join('');
                if (spec) html += \`<span class="number-ball ball-power-special">\${spec < 10 ? '0'+spec : spec}</span>\`;
            } else if (game === 'lotto535') {
                const main = numbers.slice(0, 5); const spec = numbers[5];
                html += main.map(n => \`<span class="number-ball ball-lotto">\${n < 10 ? '0'+n : n}</span>\`).join('');

                html += numbers.map((str, idx) => {
                    const b = String(str).split('').map(d => \`<span class="number-ball ball-max3d">\${d}</span>\`).join('');
                    return idx < numbers.length - 1 ? b + \`<span class="divider-3d"></span>\` : b;
                }).join('');
            } else { html += numbers.map(n => \`<span class="number-ball ball-default">\${n < 10 ? '0'+n : n}</span>\`).join(''); }
            html += \`</div>\`;
            resDiv.innerHTML = html;
        }
        function switchGame(game) { currentGame = game; document.getElementById('current-game-badge').innerText = GAME_NAMES[game]; fetchLiveDraw(game); }
        async function trainAndPredict() {
            const statusEl = document.getElementById('training-status'); const progressEl = document.getElementById('training-progress');
            statusEl.innerText = "Tải lịch sử..."; logTrain(\`<b class="text-amber-400">[AI Load]</b> Đang tải file lịch sử data/\${currentGame}.json...\`);
            try {
                const res = await fetch(\`\${GITHUB_REPO_DATA}\${currentGame}.json\`);
                if (!res.ok) throw new Error("Chưa có file lịch sử trên Repo. Vui lòng bấm ?action=run-now trên Worker.");
                const json = await res.json(); const draws = json.draws || [];
                if (draws.length < 5) throw new Error("Chưa đủ dữ liệu lịch sử để huấn luyện AI.");
                logTrain(\`<b class="text-emerald-400">[Data]</b> Tìm thấy \${draws.length} kỳ quay lịch sử thật!\`); statusEl.innerText = "Huấn luyện AI...";
                let maxNum = currentGame === 'power655' ? 55 : (currentGame === 'lotto535' ? 35 : 45);
                const vectors = draws.map(d => { const v = new Array(maxNum).fill(0); if (Array.isArray(d.nums)) { d.nums.forEach(n => { if (n >= 1 && n <= maxNum) v[n - 1] = 1; }); } return v; });
                const xs = tf.tensor2d(vectors.slice(0, -1)); const ys = tf.tensor2d(vectors.slice(1));
                const model = tf.sequential(); model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [maxNum] })); model.add(tf.layers.dense({ units: maxNum, activation: 'sigmoid' })); model.compile({ optimizer: tf.train.adam(0.01), loss: 'binaryCrossentropy' });
                const epochs = 10;
                for (let e = 1; e <= epochs; e++) {
                    const h = await model.fit(xs, ys, { epochs: 1 }); progressEl.style.width = \`\${Math.round((e / epochs) * 100)}%\`;
                    logTrain(\`Epoch <b>\${e}/\${epochs}</b> - Loss: <b class="text-amber-400">\${h.history.loss[0].toFixed(4)}</b>\`); await tf.nextFrame();
                }
                const lastTensor = tf.tensor2d([vectors[0]]); const pred = await model.predict(lastTensor).data();
                let indexed = Array.from(pred).map((p, i) => ({ num: i + 1, prob: p })); indexed.sort((a, b) => b.prob - a.prob);
                const topNums = indexed.slice(0, 6).map(x => x.num).sort((a, b) => a - b);
                logTrain(\`<b class="text-emerald-400">[Xác suất AI]</b> Top 6 số có mật độ xuất hiện cao nhất: <b>\${topNums.join(', ')}</b>\`);
                xs.dispose(); ys.dispose(); model.dispose(); lastTensor.dispose(); statusEl.innerText = "Hoàn tất!";
            } catch (err) { statusEl.innerText = "Lỗi!"; logTrain(\`<span class="text-red-400">[AI Error]</span> \${err.message}\`); }
        }
        window.onload = () => { if (window.lucide) lucide.createIcons(); fetchLiveDraw('mega645'); };
    <\/script>
</body>
</html>`;
